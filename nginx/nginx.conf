worker_processes auto;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    server {
        listen 80;
        server_name _;
        root /opt/ollp/frontend;
        index index.html;
        client_max_body_size 50m;
        resolver 127.0.0.11 valid=30s ipv6=off;

        # Cache control for static assets with version
        location ~* \.js\?v=[0-9]+$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.css\?v=[0-9]+$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # No cache for HTML
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # API requests — dynamic DNS resolution per request
        set $backend http://backend:8000;
        location /api/ {
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /ws/ {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
        location /health { proxy_pass $backend; }
        location /docs { proxy_pass $backend; }
        location /redoc { proxy_pass $backend; }
        location /monitor { proxy_pass $backend; }
        location /admin { proxy_pass $backend; }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
