version: '3.8'

services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: ollp-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ollp_user:${POSTGRES_PASSWORD}@db:5432/ollp_db
      - SECRET_KEY=${SECRET_KEY}
      - CRYPTO_KEY_HEX=${CRYPTO_KEY_HEX}
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend_logs:/app/logs
      - ./data:/app/data
    networks:
      - ollp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: ollp-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ollp_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ollp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - ollp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ollp_user -d ollp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ollp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ollp-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ollp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - ollp-network
    restart: unless-stopped

  # Frontend build server (serves static files)
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.production
    container_name: ollp-frontend
    networks:
      - ollp-network
    restart: unless-stopped

  # MinIO object storage
  minio:
    image: minio/minio:latest
    container_name: ollp-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - ollp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Celery worker for async tasks
  worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: ollp-worker
    command: celery -A src.tasks.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - CRYPTO_KEY_HEX=${CRYPTO_KEY_HEX}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgresql://ollp_user:${POSTGRES_PASSWORD}@db:5432/ollp_db
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    volumes:
      - backend_logs:/app/logs
      - ./data:/app/data
    depends_on:
      - redis
      - db
      - minio
    networks:
      - ollp-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  minio_data:

networks:
  ollp-network:
    driver: bridge
