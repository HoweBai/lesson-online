version: '3.8'

services:
  # ==================== Nginx 反向代理 ====================
  nginx:
    image: nginx:alpine
    container_name: ollp-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== 后端 API 服务 ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ollp-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://ollp_user:${POSTGRES_PASSWORD}@db:5432/ollp_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - CRYPTO_KEY_HEX=${CRYPTO_KEY_HEX}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - app_logs:/app/logs
      - tutorial_uploads:/app/uploads
      - ./src/backend:/app/src/backend:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== Celery Worker ====================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ollp-worker
    restart: always
    command: celery -A src.tasks.generation_tasks worker --loglevel=info --concurrency=4 -E
    environment:
      - DATABASE_URL=postgresql://ollp_user:${POSTGRES_PASSWORD}@db:5432/ollp_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - CRYPTO_KEY_HEX=${CRYPTO_KEY_HEX}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - app_logs:/app/logs
      - tutorial_uploads:/app/uploads
      - ./src/backend:/app/src/backend:ro
    depends_on:
      - db
      - redis
      - minio
    networks:
      - platform-net

  # ==================== 前端应用 ====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ollp-frontend
    restart: always
    environment:
      - API_URL=http://backend:8000
      - NODE_ENV=production
    volumes:
      - ./src/frontend:/app/frontend:ro
      - /app/frontend/node_modules
    depends_on:
      - backend
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== 数据库 (PostgreSQL) ====================
  db:
    image: postgres:15-alpine
    container_name: ollp-db
    restart: always
    environment:
      - POSTGRES_USER=ollp_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ollp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ollp_user -d ollp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ==================== 缓存与消息队列 (Redis) ====================
  redis:
    image: redis:7-alpine
    container_name: ollp-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ==================== 对象存储 (MinIO) ====================
  minio:
    image: minio/minio:latest
    container_name: ollp-minio
    restart: always
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

# ==================== 数据卷 ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  app_logs:
    driver: local
  tutorial_uploads:
    driver: local

# ==================== 网络 ====================
networks:
  platform-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
